[package]
name = "jarvis-vpn"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
tokio.workspace = true
url = "2"
percent-encoding = "2"
hex = "0.4"
getrandom = "0.3"
base64 = "0.22"
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
x509-parser = { version = "0.18", default-features = false }
# Connection-scoped REALITY hooks; no global patch to the TLS used by other modules.
reality-tls = { package = "rustls", path = "../../vendor/reality-tls", default-features = false, features = ["ring", "std", "brotli", "tls12"] }
ml-kem = { version = "0.2.3", features = ["zeroize", "deterministic"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rand_core = { version = "0.6", features = ["getrandom"] }
